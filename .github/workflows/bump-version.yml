name: Bump Minor Version

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    # Skip if this commit was created by this workflow to avoid infinite loops
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump minor version
        id: bump
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version minor --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new }}"
          OLD_VERSION="${{ steps.bump.outputs.old }}"
          DATE=$(date -u +%Y-%m-%d)

          # Gather commits since the previous version tag (or all commits if no tag)
          if git rev-list "v${OLD_VERSION}" > /dev/null 2>&1; then
            COMMITS=$(git log "v${OLD_VERSION}..HEAD~1" --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log HEAD~1 --pretty=format:"- %s" --no-merges | head -20)
          fi

          # Build the new changelog entry
          ENTRY="## [${NEW_VERSION}] - ${DATE}\n\n### Changed\n${COMMITS}\n"

          # Insert after the [Unreleased] line
          sed -i "s|## \[Unreleased\]|## [Unreleased]\n\n${ENTRY}|" CHANGELOG.md

      - name: Commit and push
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new }}"
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin main --follow-tags
