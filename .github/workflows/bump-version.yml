name: Bump Minor Version

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    # Skip if this commit was created by this workflow to avoid infinite loops
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump minor version
        id: bump
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version minor --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new }}
          OLD_VERSION: ${{ steps.bump.outputs.old }}
        run: |
          export DATE=$(date -u +%Y-%m-%d)

          # Write commits to a file to safely handle special characters
          if git rev-list "v${OLD_VERSION}" > /dev/null 2>&1; then
            git log "v${OLD_VERSION}..HEAD" --pretty=format:"- %s" --no-merges > /tmp/commits.txt
          else
            git log HEAD --pretty=format:"- %s" --no-merges | head -20 > /tmp/commits.txt
          fi

          python3 .github/scripts/update_changelog.py

      - name: Open version bump PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to v${{ steps.bump.outputs.new }}"
          branch: chore/bump-version
          delete-branch: true
          title: "chore: bump version to v${{ steps.bump.outputs.new }}"
          body: Automated minor version bump to v${{ steps.bump.outputs.new }}.
          labels: automated

      - name: Auto-merge version bump PR
        if: steps.cpr.outputs.pull-request-operation == 'created'
        continue-on-error: true
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
